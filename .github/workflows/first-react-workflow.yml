name: 'First React Workflow'
on: 
  push:
  pull_request:
jobs:
    first-job:
      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: setup node js in VM
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
        
        - name: install dependency
          run: npm ci

        - name: make react build
          run: npm run build

        - name: create artifacts
          uses: actions/upload-artifact@v4
          with:
            name: react-build
            path: dis/
            retention-days: 7