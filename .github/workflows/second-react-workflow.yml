name: 'second react workflow'
on:
  push:
  pull_request:
jobs:
    lint-jobs:
      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: setup node js in vm
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install dependency
          run: npm ci

        - name: install ESLint in app
          run: npm run lint

    build-jobs:
      needs: [lint-jobs]
      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: setup node js in vm
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: install dependency
          run: npm ci

        - name: make react build
          run: npm run build

        - name: creat artifacts
          uses: actions/upload-artifact@v4
          with:
            name: react-build
            path: dist/
            retention-days: 7

    deploy-jobs:
      needs: [lint-jobs, build-jobs]
      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: install vercel CLI
          run: npm install vercel

        - name: deployment on vercel
          run: vercel --prod --yes --token="${{secrets.VERCEL_TOKEN}}"  